[build]
  publish = "dist/public"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5000
  publish = "dist/public"
  functions = "netlify/functions"

# Function configuration
[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[functions."api"]
  timeout = 30

# Headers for CORS and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization, X-Admin-Invite-Token"
    Access-Control-Allow-Methods = "GET, POST, PUT, PATCH, DELETE, OPTIONS"

# API redirect MUST come before the SPA catch-all
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA catch-all (after API redirect)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
