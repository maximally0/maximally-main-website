        - heading "Participation Expectations" [level=3] [ref=e274]
        - generic [ref=e275]:
          - paragraph [ref=e276]: Senior Council members actively contribute to the Maximally ecosystem. Members are expected to participate in at least one Maximally program per quarter as a judge, mentor, or evaluator.
          - paragraph [ref=e277]: The council is designed to remain active, operational, and closely connected to the builders participating in Maximally programs.
      - generic [ref=e278]:
        - heading "Selection Process" [level=3] [ref=e279]
        - generic [ref=e280]:
          - paragraph [ref=e281]: Applications are reviewed periodically by the Maximally team and existing council members. Admission is granted only to individuals whose work demonstrates clear and documented impact in their field.
          - paragraph [ref=e282]: Not all qualified applicants are admitted. Selectivity is intentional. The Senior Council exists to maintain the standard of evaluation across Maximally programs.
